<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mom Guide</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-content">
                <div class="brand">
                    <div class="logo"><span>👩‍🍼</span></div>
                    <div class="brand-text">
                        <h1>AI Mom Guide</h1>
                        <span class="status"><span class="status-dot"></span>Online</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="welcome-message" id="welcomeMessage">
                <div class="welcome-bubble">
                    <div class="welcome-avatar">👩‍🍼</div>
                    <div class="welcome-content">
                        <h2>Welcome, Mama! 💕</h2>
                        <p>I'm here to help with feeding, sleep, milestones, and everything in between. Ask me anything about your little one!</p>
                    </div>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-bubble">
                    <div class="typing-avatar">👩‍🍼</div>
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            </div>
        </main>

        <!-- Quick Topic Buttons -->
        <div class="quick-topics" id="quickTopics">
            <button class="topic-btn" onclick="startTopic('sleep')">😴 Sleep Help</button>
            <button class="topic-btn" onclick="startTopic('feeding')">🍼 Feeding Guide</button>
            <button class="topic-btn" onclick="startTopic('milestones')">📊 Milestones</button>
            <button class="topic-btn" onclick="startTopic('safety')">🛡️ Safety Tips</button>
            <button class="topic-btn" onclick="startTopic('newborn')">👶 Newborn Care</button>
            <button class="topic-btn" onclick="startTopic('health')">🏥 Health</button>
        </div>

        <!-- Input Area -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Ask me anything about your baby's care..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">
                <span>Press Enter to send</span>
                <span>Shift + Enter for new line</span>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
